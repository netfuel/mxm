# Cloudflare Pages project, deployed from GitHub (netfuel/mxm) on every push to main.
# Dashboard build settings: framework none, build command empty, output directory "public".
name = "mxm"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# Videos, posters and previews live in R2 and are served at /media/* by functions/media/[[path]].js
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mxm"

# ---- Mail admin (/admin) --------------------------------------------------------------
# See docs/mail-setup.md. The sending token CF_EMAIL_TOKEN is a Pages secret set in the dashboard, never here.
[[d1_databases]]
binding = "DB"
database_name = "mxm-mail"
database_id = "fbd4fa36-795f-4ffe-859d-f33bdc8f5da0"

[vars]
CF_ACCOUNT_ID = "cf13331fb5a6eb8a7647696c8ee027e0"
# Cloudflare Access application "MXM mail admin" (one-time email code, netfuel@gmail.com only)
ACCESS_TEAM_DOMAIN = "shrill-fog-49e0.cloudflareaccess.com"
ACCESS_AUD = "b83e81e898a64494e377ae92aa9da9330aaf7531d76dcaa588382d313d2ae271"
